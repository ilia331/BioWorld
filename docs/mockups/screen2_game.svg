<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" font-family="Segoe UI, Arial, sans-serif">
  <title>BioWorld — макет на екран 2: долината (десктоп и телефон)</title>
  <rect width="1280" height="1000" fill="#eef3ee"/>
  <text x="20" y="28" font-size="14" fill="#666">Макет 2 — Игрови екран · десктоп (ляво) и телефон (дясно) · примерни числа, чернова за обсъждане</text>

  <!-- ===== ДЕСКТОП ===== -->
  <rect x="20" y="44" width="880" height="936" rx="10" fill="#fff" stroke="#999"/>
  <rect x="20" y="44" width="880" height="56" rx="10" fill="#2f6b4f"/>
  <rect x="20" y="84" width="880" height="16" fill="#2f6b4f"/>
  <text x="40" y="80" font-size="18" font-weight="bold" fill="#fff">← Мисия 1: Първи живот</text>
  <text x="520" y="80" font-size="16" fill="#fff">Ход 3 / 10</text>
  <text x="880" y="80" font-size="13" text-anchor="end" fill="#d9eadf">Цел: трите вида оцеляват</text>

  <!-- показатели -->
  <g font-size="13">
    <rect x="40" y="116" width="200" height="62" rx="8" fill="#e3f0fb" stroke="#5b9bd5"/>
    <text x="54" y="140" fill="#245">💧 Вода</text>
    <text x="54" y="166" font-size="20" font-weight="bold" fill="#245">48 / 100</text>
    <text x="226" y="166" text-anchor="end" fill="#c0392b">−12</text>

    <rect x="252" y="116" width="200" height="62" rx="8" fill="#e8f5e1" stroke="#6aa84f"/>
    <text x="266" y="140" fill="#263">🌿 Трева</text>
    <text x="266" y="166" font-size="20" font-weight="bold" fill="#263">212</text>
    <text x="438" y="166" text-anchor="end" fill="#27ae60">+12</text>

    <rect x="464" y="116" width="200" height="62" rx="8" fill="#fbf1e3" stroke="#d4a15a"/>
    <text x="478" y="140" fill="#542">🐇 Зайци</text>
    <text x="478" y="166" font-size="20" font-weight="bold" fill="#542">24</text>
    <text x="650" y="166" text-anchor="end" fill="#27ae60">+4</text>

    <rect x="676" y="116" width="204" height="62" rx="8" fill="#fbe7e3" stroke="#d07a5a"/>
    <text x="690" y="140" fill="#522">🦊 Лисици</text>
    <text x="690" y="166" font-size="20" font-weight="bold" fill="#522">4</text>
    <text x="866" y="166" text-anchor="end" fill="#777">0</text>
  </g>

  <!-- сцена -->
  <rect x="40" y="192" width="500" height="280" rx="8" fill="#d8ecc8" stroke="#8bb07a"/>
  <rect x="40" y="192" width="500" height="70" rx="8" fill="#cfe6f5"/>
  <ellipse cx="160" cy="370" rx="90" ry="40" fill="#7fb7e0" stroke="#4f8fbf"/>
  <text x="160" y="375" font-size="12" text-anchor="middle" fill="#fff">водоем</text>
  <g font-size="22">
    <text x="300" y="320">🌿</text><text x="340" y="300">🌿</text><text x="380" y="330">🌿</text>
    <text x="440" y="310">🌿</text><text x="480" y="340">🌿</text><text x="320" y="420">🌿</text>
    <text x="420" y="440">🌿</text><text x="270" y="450">🌿</text>
    <text x="360" y="370">🐇</text><text x="410" y="390">🐇</text><text x="460" y="400">🐇</text>
    <text x="250" y="390">🐇</text>
    <text x="480" y="450">🦊</text>
  </g>
  <text x="56" y="214" font-size="12" fill="#456">2D сцена (SVG): броят картинки следва стойностите</text>
  <rect x="320" y="200" width="210" height="28" rx="6" fill="#fff" opacity="0.9"/>
  <text x="330" y="219" font-size="13" fill="#c0392b">☀ Събитие миналия ход: Суша</text>

  <!-- прогноза -->
  <rect x="556" y="192" width="324" height="280" rx="8" fill="#fffbea" stroke="#e0c25a"/>
  <text x="572" y="218" font-size="16" font-weight="bold" fill="#553">1. Твоята прогноза</text>
  <g font-size="13" fill="#333">
    <text x="572" y="252">💧 Вода</text>
    <text x="572" y="290">🌿 Трева</text>
    <text x="572" y="328">🐇 Зайци</text>
    <text x="572" y="366">🦊 Лисици</text>
  </g>
  <g font-size="15" text-anchor="middle">
    <!-- ред вода: ↓ избрано -->
    <rect x="690" y="234" width="50" height="28" rx="5" fill="#fff" stroke="#bbb"/><text x="715" y="254">↑</text>
    <rect x="748" y="234" width="50" height="28" rx="5" fill="#fff" stroke="#bbb"/><text x="773" y="254">=</text>
    <rect x="806" y="234" width="50" height="28" rx="5" fill="#e0c25a" stroke="#a88a20"/><text x="831" y="254">↓</text>
    <!-- трева: ↑ -->
    <rect x="690" y="272" width="50" height="28" rx="5" fill="#e0c25a" stroke="#a88a20"/><text x="715" y="292">↑</text>
    <rect x="748" y="272" width="50" height="28" rx="5" fill="#fff" stroke="#bbb"/><text x="773" y="292">=</text>
    <rect x="806" y="272" width="50" height="28" rx="5" fill="#fff" stroke="#bbb"/><text x="831" y="292">↓</text>
    <!-- зайци: ↑ -->
    <rect x="690" y="310" width="50" height="28" rx="5" fill="#e0c25a" stroke="#a88a20"/><text x="715" y="330">↑</text>
    <rect x="748" y="310" width="50" height="28" rx="5" fill="#fff" stroke="#bbb"/><text x="773" y="330">=</text>
    <rect x="806" y="310" width="50" height="28" rx="5" fill="#fff" stroke="#bbb"/><text x="831" y="330">↓</text>
    <!-- лисици: = -->
    <rect x="690" y="348" width="50" height="28" rx="5" fill="#fff" stroke="#bbb"/><text x="715" y="368">↑</text>
    <rect x="748" y="348" width="50" height="28" rx="5" fill="#e0c25a" stroke="#a88a20"/><text x="773" y="368">=</text>
    <rect x="806" y="348" width="50" height="28" rx="5" fill="#fff" stroke="#bbb"/><text x="831" y="368">↓</text>
  </g>
  <rect x="572" y="394" width="292" height="62" rx="5" fill="#fff" stroke="#ccc"/>
  <text x="582" y="416" font-size="12" fill="#999">Защо мисля така? (по желание)</text>
  <text x="582" y="440" font-size="13" fill="#333">„Засаждам трева, затова зайците ще имат храна.“</text>

  <!-- действия -->
  <text x="40" y="504" font-size="16" font-weight="bold" fill="#234">2. Избери действие</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="516" width="160" height="58" rx="8" fill="#e8f5e1" stroke="#2f6b4f" stroke-width="3"/>
    <text x="120" y="540" font-weight="bold">🌿 Засади трева</text><text x="120" y="562" fill="#555">−10 вода</text>

    <rect x="208" y="516" width="160" height="58" rx="8" fill="#fff" stroke="#999"/>
    <text x="288" y="540" font-weight="bold">💧 Възстанови водоем</text><text x="288" y="562" fill="#555">остават 2 / 2</text>

    <rect x="376" y="516" width="160" height="58" rx="8" fill="#fff" stroke="#999"/>
    <text x="456" y="540" font-weight="bold">🐇 Добави зайци</text><text x="456" y="562" fill="#555">остават 3 / 3</text>

    <rect x="544" y="516" width="160" height="58" rx="8" fill="#eee" stroke="#ccc"/>
    <text x="624" y="540" font-weight="bold" fill="#999">🦊 Добави лисици</text><text x="624" y="562" fill="#999">остават 0 / 2</text>

    <rect x="712" y="516" width="168" height="58" rx="8" fill="#fff" stroke="#999"/>
    <text x="796" y="540" font-weight="bold">✋ Без намеса</text><text x="796" y="562" fill="#555">безплатно</text>
  </g>
  <rect x="40" y="582" width="664" height="28" rx="5" fill="#fdecea" stroke="#e6a19a"/>
  <text x="52" y="601" font-size="13" fill="#c0392b">⚠ „Добави лисици“ не е налично: вече го използва 2 пъти в тази мисия.</text>

  <rect x="712" y="582" width="168" height="44" rx="8" fill="#2f6b4f"/>
  <text x="796" y="610" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Следващ ход ▶</text>

  <!-- графика -->
  <rect x="40" y="640" width="420" height="320" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="56" y="664" font-size="15" font-weight="bold" fill="#234">Графика по ходове (Chart.js)</text>
  <line x1="80" y1="920" x2="440" y2="920" stroke="#888"/>
  <line x1="80" y1="690" x2="80" y2="920" stroke="#888"/>
  <g font-size="11" fill="#777">
    <text x="80" y="938">0</text><text x="160" y="938">1</text><text x="240" y="938">2</text><text x="320" y="938">3</text>
    <text x="400" y="938">… 10</text>
  </g>
  <polyline points="80,800 160,790 240,808 320,782" fill="none" stroke="#6aa84f" stroke-width="3"/>
  <polyline points="80,860 160,850 240,868 320,880" fill="none" stroke="#5b9bd5" stroke-width="3"/>
  <polyline points="80,880 160,876 240,872 320,864" fill="none" stroke="#d4a15a" stroke-width="3"/>
  <polyline points="80,905 160,905 240,905 320,905" fill="none" stroke="#d07a5a" stroke-width="3"/>
  <g font-size="11">
    <text x="340" y="700" fill="#6aa84f">■ трева</text><text x="340" y="716" fill="#5b9bd5">■ вода</text>
    <text x="340" y="732" fill="#d4a15a">■ зайци</text><text x="340" y="748" fill="#d07a5a">■ лисици</text>
  </g>

  <!-- дневник -->
  <rect x="476" y="640" width="404" height="320" rx="8" fill="#f7f4ff" stroke="#9b8ad0"/>
  <text x="492" y="664" font-size="15" font-weight="bold" fill="#433">📓 Дневник на причините — ход 2</text>
  <g font-size="12" fill="#333">
    <text x="492" y="692" font-weight="bold">Показател   Прогноза   Резултат        Съвпада?</text>
    <text x="492" y="714">Вода              ↓              60 → 48  ↓           ✓</text>
    <text x="492" y="734">Трева             ↑              200 → 212 ↑         ✓</text>
    <text x="492" y="754">Зайци             =              20 → 24  ↑           ✗</text>
    <text x="492" y="774">Лисици           =              4 → 4   =             ✓</text>
    <text x="492" y="800" font-weight="bold" fill="#5a3">Точки за разбиране: 3 / 4</text>
    <text x="492" y="830" font-weight="bold">Защо?</text>
    <text x="492" y="852">Суша → вода −20</text>
    <text x="492" y="872">Засадена трева → трева +50, но по-малко вода → по-бавен растеж</text>
    <text x="492" y="892">Достатъчно трева → повече нови зайци</text>
    <text x="492" y="912">Малко зайци на лисица → лисиците не се увеличават</text>
  </g>

  <!-- ===== ТЕЛЕФОН ===== -->
  <rect x="940" y="44" width="320" height="936" rx="28" fill="#222"/>
  <rect x="954" y="74" width="292" height="880" rx="6" fill="#fff"/>
  <rect x="954" y="74" width="292" height="44" fill="#2f6b4f"/>
  <text x="966" y="102" font-size="14" font-weight="bold" fill="#fff">← Мисия 1</text>
  <text x="1234" y="102" font-size="14" text-anchor="end" fill="#fff">Ход 3/10</text>
  <g font-size="12">
    <rect x="964" y="126" width="132" height="40" rx="6" fill="#e3f0fb" stroke="#5b9bd5"/><text x="972" y="151">💧 Вода 48</text>
    <rect x="1104" y="126" width="132" height="40" rx="6" fill="#e8f5e1" stroke="#6aa84f"/><text x="1112" y="151">🌿 Трева 212</text>
    <rect x="964" y="172" width="132" height="40" rx="6" fill="#fbf1e3" stroke="#d4a15a"/><text x="972" y="197">🐇 Зайци 24</text>
    <rect x="1104" y="172" width="132" height="40" rx="6" fill="#fbe7e3" stroke="#d07a5a"/><text x="1112" y="197">🦊 Лисици 4</text>
  </g>
  <rect x="964" y="220" width="272" height="130" rx="6" fill="#d8ecc8" stroke="#8bb07a"/>
  <ellipse cx="1020" cy="300" rx="40" ry="20" fill="#7fb7e0"/>
  <text x="1080" y="290" font-size="18">🌿🌿🐇🌿</text><text x="1100" y="330" font-size="18">🐇🌿🦊</text>
  <rect x="964" y="358" width="272" height="150" rx="6" fill="#fffbea" stroke="#e0c25a"/>
  <text x="974" y="378" font-size="13" font-weight="bold">1. Прогноза</text>
  <g font-size="12"><text x="974" y="404">💧  [↑] [=] [↓]</text><text x="974" y="430">🌿  [↑] [=] [↓]</text>
    <text x="974" y="456">🐇  [↑] [=] [↓]</text><text x="974" y="482">🦊  [↑] [=] [↓]</text></g>
  <text x="974" y="530" font-size="13" font-weight="bold">2. Действие</text>
  <g font-size="12">
    <rect x="964" y="538" width="272" height="34" rx="6" fill="#e8f5e1" stroke="#2f6b4f" stroke-width="2"/><text x="974" y="560">🌿 Засади трева · −10 вода</text>
    <rect x="964" y="578" width="272" height="34" rx="6" fill="#fff" stroke="#999"/><text x="974" y="600">💧 Възстанови водоем · 2/2</text>
    <rect x="964" y="618" width="272" height="34" rx="6" fill="#fff" stroke="#999"/><text x="974" y="640">🐇 Добави зайци · 3/3</text>
    <rect x="964" y="658" width="272" height="34" rx="6" fill="#eee" stroke="#ccc"/><text x="974" y="680" fill="#999">🦊 Добави лисици · 0/2</text>
    <rect x="964" y="698" width="272" height="34" rx="6" fill="#fff" stroke="#999"/><text x="974" y="720">✋ Без намеса</text>
  </g>
  <rect x="964" y="742" width="272" height="44" rx="8" fill="#2f6b4f"/>
  <text x="1100" y="770" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Следващ ход ▶</text>
  <rect x="964" y="796" width="272" height="70" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="974" y="816" font-size="12" font-weight="bold">Графика</text>
  <polyline points="980,850 1040,846 1100,852 1160,840" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <rect x="964" y="874" width="272" height="70" rx="6" fill="#f7f4ff" stroke="#9b8ad0"/>
  <text x="974" y="894" font-size="12" font-weight="bold">📓 Дневник на причините ▾</text>
  <text x="974" y="914" font-size="11">Суша → вода −20 → по-бавна трева</text>
  <text x="974" y="932" font-size="11" fill="#777">Подредба на телефон: една колона</text>
</svg>
