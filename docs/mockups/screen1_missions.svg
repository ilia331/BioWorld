<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Segoe UI, Arial, sans-serif">
  <title>BioWorld — макет на екран 1: избор на мисия (десктоп и телефон)</title>
  <rect width="1280" height="820" fill="#eef3ee"/>
  <text x="20" y="28" font-size="14" fill="#666">Макет 1 — Избор на мисия · десктоп (ляво) и телефон (дясно) · чернова за обсъждане</text>

  <!-- ===== ДЕСКТОП ===== -->
  <rect x="20" y="44" width="880" height="756" rx="10" fill="#fff" stroke="#999"/>
  <!-- горна лента -->
  <rect x="20" y="44" width="880" height="64" rx="10" fill="#2f6b4f"/>
  <rect x="20" y="90" width="880" height="18" fill="#2f6b4f"/>
  <text x="44" y="84" font-size="24" font-weight="bold" fill="#fff">BioWorld — Долината на равновесието</text>
  <rect x="680" y="62" width="90" height="30" rx="6" fill="#fff"/>
  <text x="725" y="82" font-size="14" text-anchor="middle" fill="#2f6b4f">Вход</text>
  <rect x="780" y="62" width="104" height="30" rx="6" fill="none" stroke="#fff"/>
  <text x="832" y="82" font-size="14" text-anchor="middle" fill="#fff">Регистрация</text>

  <!-- правила -->
  <rect x="44" y="126" width="832" height="128" rx="8" fill="#f4f8f4" stroke="#b8cfc0"/>
  <text x="64" y="154" font-size="18" font-weight="bold" fill="#234">Как се играе</text>
  <text x="64" y="180" font-size="14" fill="#333">1. Всяка мисия трае 10 хода. На всеки ход избираш едно действие: трева, водоем, зайци, лисици или без намеса.</text>
  <text x="64" y="202" font-size="14" fill="#333">2. Преди хода правиш прогноза (↑ = ↓). След хода сравняваш с резултата в „Дневника на причините“.</text>
  <text x="64" y="224" font-size="14" fill="#333">3. Целта е да разбереш защо се променя долината — не просто да имаш най-много животни.</text>
  <text x="64" y="244" font-size="12" font-style="italic" fill="#777">Това е опростен учебен модел, а не научна прогноза за истинска екосистема.</text>

  <text x="44" y="290" font-size="18" font-weight="bold" fill="#234">Избери мисия</text>

  <!-- карти: 3 + 2 -->
  <g font-size="13" fill="#333">
    <!-- карта 1 (избрана) -->
    <rect x="44" y="306" width="264" height="190" rx="8" fill="#fff" stroke="#2f6b4f" stroke-width="3"/>
    <text x="60" y="334" font-size="16" font-weight="bold" fill="#2f6b4f">1. Първи живот</text>
    <text x="60" y="360">Трева → зайци → лисици</text>
    <text x="60" y="384" font-weight="bold">Цел:</text>
    <text x="60" y="402">И трите вида оцеляват 10 хода.</text>
    <text x="60" y="438">Трудност: 🌿</text>
    <text x="60" y="476" fill="#2f6b4f">✓ Избрана</text>

    <rect x="324" y="306" width="264" height="190" rx="8" fill="#fff" stroke="#999"/>
    <text x="340" y="334" font-size="16" font-weight="bold" fill="#234">2. Пресъхналият поток</text>
    <text x="340" y="360">Малко вода забавя растежа</text>
    <text x="340" y="384" font-weight="bold">Цел:</text>
    <text x="340" y="402">Водата остава над прага.</text>
    <text x="340" y="438">Трудност: 🌿🌿</text>

    <rect x="604" y="306" width="272" height="190" rx="8" fill="#fff" stroke="#999"/>
    <text x="620" y="334" font-size="16" font-weight="bold" fill="#234">3. Твърде много зайци</text>
    <text x="620" y="360">Пренаселване, малко трева</text>
    <text x="620" y="384" font-weight="bold">Цел:</text>
    <text x="620" y="402">Тревата и зайците остават</text>
    <text x="620" y="420">жизнеспособни.</text>
    <text x="620" y="438">Трудност: 🌿🌿</text>

    <rect x="44" y="512" width="264" height="170" rx="8" fill="#f0f0f0" stroke="#bbb"/>
    <text x="60" y="540" font-size="16" font-weight="bold" fill="#888">4. Изчезващият хищник</text>
    <text x="60" y="566" fill="#888">Болест намалява лисиците</text>
    <text x="60" y="590" fill="#888">Цел: популациите се стабилизират.</text>
    <text x="60" y="624" fill="#888">Трудност: 🌿🌿🌿</text>
    <text x="60" y="660" fill="#888">🔒 Заключена (въпрос за обсъждане)</text>

    <rect x="324" y="512" width="264" height="170" rx="8" fill="#f0f0f0" stroke="#bbb"/>
    <text x="340" y="540" font-size="16" font-weight="bold" fill="#888">5. Непредвидима година</text>
    <text x="340" y="566" fill="#888">Дъжд, суша и болест</text>
    <text x="340" y="590" fill="#888">Цел: устойчив баланс.</text>
    <text x="340" y="624" fill="#888">Трудност: 🌿🌿🌿</text>
    <text x="340" y="660" fill="#888">🔒 Заключена</text>
  </g>

  <!-- бутони -->
  <rect x="604" y="580" width="272" height="44" rx="8" fill="#2f6b4f"/>
  <text x="740" y="608" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">Започни мисия 1</text>
  <rect x="604" y="636" width="272" height="44" rx="8" fill="#fff" stroke="#2f6b4f" stroke-width="2"/>
  <text x="740" y="664" font-size="16" text-anchor="middle" fill="#2f6b4f">Продължи (ход 4 / 10)</text>
  <text x="604" y="700" font-size="12" fill="#777">„Продължи“ е активен само при записана игра.</text>

  <text x="44" y="770" font-size="12" fill="#999">Бележки: зелена рамка = избрана карта; сиво = недостъпно.</text>

  <!-- ===== ТЕЛЕФОН ===== -->
  <rect x="940" y="44" width="320" height="756" rx="28" fill="#222"/>
  <rect x="954" y="74" width="292" height="700" rx="6" fill="#fff"/>
  <rect x="954" y="74" width="292" height="48" fill="#2f6b4f"/>
  <text x="966" y="104" font-size="15" font-weight="bold" fill="#fff">BioWorld</text>
  <text x="1236" y="104" font-size="20" text-anchor="end" fill="#fff">☰</text>
  <g font-size="12" fill="#333">
    <rect x="966" y="134" width="268" height="78" rx="6" fill="#f4f8f4" stroke="#b8cfc0"/>
    <text x="976" y="154" font-weight="bold">Как се играе ▾</text>
    <text x="976" y="174">10 хода · 1 действие на ход</text>
    <text x="976" y="192">Прогноза преди хода, обяснение след него</text>

    <rect x="966" y="224" width="268" height="96" rx="6" fill="#fff" stroke="#2f6b4f" stroke-width="2"/>
    <text x="976" y="246" font-size="14" font-weight="bold" fill="#2f6b4f">1. Първи живот</text>
    <text x="976" y="268">Цел: трите вида оцеляват 10 хода</text>
    <text x="976" y="290">Трудност: 🌿</text>

    <rect x="966" y="330" width="268" height="78" rx="6" fill="#fff" stroke="#999"/>
    <text x="976" y="352" font-size="14" font-weight="bold">2. Пресъхналият поток</text>
    <text x="976" y="374">Цел: водата над прага</text>

    <rect x="966" y="418" width="268" height="78" rx="6" fill="#fff" stroke="#999"/>
    <text x="976" y="440" font-size="14" font-weight="bold">3. Твърде много зайци</text>
    <text x="976" y="462">Цел: трева и зайци жизнеспособни</text>

    <rect x="966" y="506" width="268" height="50" rx="6" fill="#f0f0f0" stroke="#bbb"/>
    <text x="976" y="536" fill="#888">🔒 4. Изчезващият хищник</text>
    <text x="1100" y="580" font-size="11" text-anchor="middle" fill="#888">↓ превърти за мисия 5</text>
  </g>
  <rect x="966" y="660" width="268" height="44" rx="8" fill="#2f6b4f"/>
  <text x="1100" y="688" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Започни</text>
  <rect x="966" y="714" width="268" height="44" rx="8" fill="#fff" stroke="#2f6b4f" stroke-width="2"/>
  <text x="1100" y="742" font-size="14" text-anchor="middle" fill="#2f6b4f">Продължи</text>
</svg>
